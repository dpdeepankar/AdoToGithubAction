name: Reusable - Terraform Validate and Build

on:
  workflow_call:
    inputs:
      working-directory-base:
        required: true
        type: string
        default: 'terraform-build-and-deploy'
      terraform-version:
        required: true
        type: string
        default: '1.9.0'
      artifact-name:
        required: true
        type: string
        default: 'terraform-source'

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Validate Terraform Syntax
        shell: bash
        run: |
          set -uo pipefail
          
          WORKING_DIR_BASE="${{ inputs.working-directory-base }}"
          echo "Working Directory Base: $WORKING_DIR_BASE"
          
          if [[ -z "$WORKING_DIR_BASE" ]]; then
            echo "Error: Working Directory Base not set" >&2
            exit 2
          fi
          
          tf_dirs=$(find "$WORKING_DIR_BASE" -type f -name '*.tf' -printf '%h\n' | sort -u)
          
          if [[ -z "$tf_dirs" ]]; then
            echo "No Terraform directories found under: $WORKING_DIR_BASE"
            exit 0
          fi
          
          for dir in $tf_dirs; do
            echo "Validating: $dir"
            cd "$dir" || exit 1
            
            terraform init -backend=false
            if [[ $? -ne 0 ]]; then
              echo "Terraform init failed for $dir" >&2
              exit 1
            fi
            
            terraform validate
            if [[ $? -ne 0 ]]; then
              echo "Validation failed for $dir" >&2
              exit 1
            fi
            
            cd - || exit 1
          done
          
          echo "All Terraform validations passed"

      - name: Upload Terraform Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_number }}
          path: ${{ inputs.working-directory-base }}