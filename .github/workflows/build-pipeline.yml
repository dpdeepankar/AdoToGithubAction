# .github/workflows/build-pipeline.yml
name: Terraform Build & Validate    # ← Name clear rakho

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform-build-and-deploy/**'
  pull_request:
    branches: [ main ]               # ← PR pe bhi dikhega
  workflow_dispatch:                 # ← Manual run button bhi aa jayega

jobs:
  build:
    uses: ./.github/workflows/reusable-terraform-validate-build.yml@main
    with:
      working-directory-base: 'terraform-build-and-deploy'
      terraform-version: '1.9.0'
