# Main Pipeline: main-pipeline.yml
# Purpose: Main workflow jo terraform-validate-build.yml ko call karta hai
# Isko .github/workflows/ directory me rakho

name: Terraform Build Pipeline

on:
  push:
    branches:
      - main
      - feature/github
    paths:
      - 'terraform-build-and-deploy/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform-build-and-deploy/**'
  workflow_dispatch:
    inputs:
      terraform_version:
        description: 'Terraform version'
        required: false
        default: '1.9.0'
env:
  GH_TOKEN: ${{ github.token }}
  
jobs:
  build-and-validate:
    name: Build and Validate Stage
    uses: ./.github/workflows/terraform-validate-build.yml
    with:
      working_directory_base: 'terraform-build-and-deploy'
      terraform_version: ${{ github.event.inputs.terraform_version || '1.9.0' }}
      runs_on: 'ubuntu-latest'
      artifact_name: 'terraform-source'

  export-artifact:
    needs: build-and-validate
    runs-on: 'ubuntu-latest'
    outputs:
      source-artifact: terraform-source-${{ needs.build-and-validate.outputs.run-number || github.run_number }}
    steps:
      - run: |
          echo "build_run_id: ${{ needs.build-and-validate.outputs.build_run_id }}"
          echo "build_run_number: ${{ needs.build-and-validate.outputs.build_run_number }}"
      

  trigger-deployment-workflow:
    needs: build-and-validate
    runs-on: 'ubuntu-latest'
    env:
      BUILD_RUN_NUMBER: ${{ needs.build-and-validate.outputs.build_run_number }}   # <-- match your output name
      BUILD_RUN_ID:     ${{ needs.build-and-validate.outputs.build_run_id }}
      REPO:             ${{ github.repository }}
      GH_PAT:           ${{ secrets.GH_PAT }}
    steps:
    - name: trigger-deployment-workflow
      run: |
        echo "Will trigger deployment for build_run_number=$BUILD_RUN_NUMBER build_run_id=$BUILD_RUN_ID"

        payload=$(cat <<EOF
        {"event_type":"on-demand-test","client_payload":{"build_run_number":"$BUILD_RUN_NUMBER","build_run_id":"$BUILD_RUN_ID","environment":"dev01"}}
        EOF
        )

        # Debug - see payload in logs (mask token)
        echo "Payload: $payload"

        resp=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_PAT" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/$REPO/dispatches" \
          -d "$payload")

        echo "Repo dispatch HTTP status: $resp"
        if [ "$resp" != "204" ]; then
          echo "::error::Repo dispatch failed with HTTP $resp"
        exit 1
        fi
