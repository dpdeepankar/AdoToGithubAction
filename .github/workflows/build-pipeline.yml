# Main Pipeline: main-pipeline.yml
# Purpose: Main workflow jo terraform-validate-build.yml ko call karta hai
# Isko .github/workflows/ directory me rakho

name: Terraform Build Pipeline

on:
  push:
    branches:
      - main
      - feature/github
    paths:
      - 'terraform-build-and-deploy/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform-build-and-deploy/**'
  workflow_dispatch:
    inputs:
      terraform_version:
        description: 'Terraform version'
        required: false
        default: '1.9.0'
env:
  GH_TOKEN: ${{ github.token }}
  
jobs:
  build-and-validate:
    name: Build and Validate Stage
    uses: ./.github/workflows/terraform-validate-build.yml
    with:
      working_directory_base: 'terraform-build-and-deploy'
      terraform_version: ${{ github.event.inputs.terraform_version || '1.9.0' }}
      runs_on: 'ubuntu-latest'
      artifact_name: 'terraform-source'

  export-artifact:
    needs: build-and-validate
    runs-on: 'ubuntu-latest'
    outputs:
      source-artifact: terraform-source-${{ needs.build-and-validate.outputs.run-number || github.run_number }}
    steps:
      - run: echo "Artifact ready for downstream"

  trigger-deployment-workflow:
    needs: build-and-validate
    runs-on: 'ubuntu-latest'
    steps:
    - name: trigger-deployment-workflow
      run: |
        curl -L \
        -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        https://api.github.com/repos/${{ github.repository }}/dispatches \
        -d '{"event_type":"on-demand-test","client_payload":{"build_run_number":"${{  needs.build-and-validate.outputs.run-number }}" ,"build_run_id":"${{ needs.build-and-validate.outputs.run-id }}", "environment":"dev01"}}'
