# Reusable Workflow: terraform-plan-approve-apply.yml
# Purpose: Plan, Manual Approval, aur Apply ke saath Terraform deployment
# Usage: Is workflow ko apne deployment workflow me call karo

name: Terraform Plan, Approve & Apply template

on:
  workflow_call:
    inputs:
      build_run_id:
        description: 'Build pipeline run id'
        required: true
        type: string
      working_dir:
        description: 'Terraform environment path (e.g., environments/dev01)'
        required: true
        type: string
      backend_storage_account:
        description: 'Backend storage account name'
        required: true
        type: string
      backend_container_name:
        description: 'Backend container name'
        required: false
        type: string
        default: 'terraform'
      backend_state_key:
        description: 'Terraform state file key (e.g., poc.tfstate)'
        required: true
        type: string
      backend_resource_group:
        description: 'Resource group for backend storage'
        required: true
        type: string
      workflow_environment:
        description: 'GitHub Environment for approval (e.g., production)'
        required: true
        type: string
      AZURE_CLIENT_ID:
        description: 'Azure Client ID for OIDC'
        required: true
        type: string
      AZURE_TENANT_ID:
        description: 'Azure Tenant ID'
        required: true
        type: string
      AZURE_SUBSCRIPTION_ID:
        description: 'Azure Subscription ID'
        required: true
        type: string
      # Alternative: Use traditional credentials (not recommended)
      # AZURE_CREDENTIALS:
      #   description: 'Azure Service Principal JSON'
      #   required: false

env:
  TF_WORKING_DIR: ${{ inputs.working_directory }}
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ inputs.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ inputs.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ inputs.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
    - name: Download Source Artifact
      uses: dawidd6/action-download-artifact@v11
      with: 
        name: drop
        workflow: tf-build-pipeline.yml
        workflow_conclusion: success
        run_id: ${{ github.event.worflow_run.id }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: run terraform init
      run: |
       echo "Running terraform init with below parameters"
       echo "backend storage account : $backendStorageAccount"
       echo "backend container name: $backendContainerName"
       echo "backend resource group: $backendResourceGroup"
       echo "backend key: $backendKey"

    - name: run terraform plan
      run: |
        echo "Running terraform plan"
        echo "terraform plan data" >> tfplan

    - name: Upload terraform plan
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: tfplan
