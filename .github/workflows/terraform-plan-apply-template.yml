name: terraform-plan-apply

on:
  workflow_call:
    inputs:
      environmentPath:
        required: true
        type: string
      terraformVersion:
        required: true
        type: string
      backendStorageAccount:
        required: true
        type: string
      backendContainerName:
        required: true
        type: string
      backendStateKey:
        required: true
        type: string
      azureSubscription:
        required: true
        type: string
      # GitHub environment name for approvals
      environment:
        required: true
        type: string

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      plan-artifact-name: ${{ steps.plan-artifact.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraformVersion }}

      - name: Az login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azureSubscription }}

      - name: Terraform Init
        working-directory: terraform-build-and-deploy/${{ inputs.environmentPath }}
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ inputs.backendStorageAccount }}" \
            -backend-config="container_name=${{ inputs.backendContainerName }}" \
            -backend-config="key=${{ inputs.backendStateKey }}"

      - name: Terraform Plan
        working-directory: terraform-build-and-deploy/${{ inputs.environmentPath }}
        run: |
          terraform plan -out=tfplan -input=false -no-color

      - name: Upload plan artifact
        id: plan-artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_number }}
          path: terraform-build-and-deploy/${{ inputs.environmentPath }}/tfplan

  # Approval is handled by GitHub Environment on apply job
  apply:
    name: Terraform Apply (approved plan)
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      # required reviewers GitHub Settings → Environments me configure karoge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraformVersion }}

      - name: Az login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azureSubscription }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_number }}
          path: terraform-plan

      - name: Terraform Init (Apply)
        working-directory: terraform-build-and-deploy/${{ inputs.environmentPath }}
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ inputs.backendStorageAccount }}" \
            -backend-config="container_name=${{ inputs.backendContainerName }}" \
            -backend-config="key=${{ inputs.backendStateKey }}" \
            -reconfigure -upgrade -input=false

      - name: Fix provider permissions (optional)
        working-directory: terraform-build-and-deploy/${{ inputs.environmentPath }}
        run: |
          if [ -d .terraform/providers ]; then
            find .terraform/providers -type f -exec chmod +x {} \;
          fi

      - name: Terraform Apply (approved plan)
        working-directory: terraform-build-and-deploy/${{ inputs.environmentPath }}
        run: |
          terraform apply -input=false "$(pwd)/../terraform-plan/tfplan"
