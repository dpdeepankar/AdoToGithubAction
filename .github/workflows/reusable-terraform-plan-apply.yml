name: Reusable - Terraform Plan and Apply

on:
  workflow_call:
    inputs:
      terraform-version:
        required: true
        type: string
        default: 'latest'
      environment-path:
        required: true
        type: string
      backend-storage-account:
        required: true
        type: string
      backend-container-name:
        required: true
        type: string
        default: 'terraform'
      backend-state-key:
        required: true
        type: string
      azure-subscription-id:  # Passed as secret if needed
        required: true
        type: string
      source-artifact-name:
        required: true
        type: string
      environment-name:  # GitHub Environment for approval
        required: true
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan-artifact: terraform-plan-${{ github.run_number }}
    steps:
      - name: Download Terraform Source Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source-artifact-name }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ inputs.backend-storage-account }}" \
            -backend-config="container_name=${{ inputs.backend-container-name }}" \
            -backend-config="key=${{ inputs.backend-state-key }}"
        working-directory: ${{ inputs.environment-path }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -out=tfplan -input=false -no-color
          terraform show -no-color tfplan > plan.txt  # Human-readable
        working-directory: ${{ inputs.environment-path }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_number }}
          path: |
            ${{ inputs.environment-path }}/tfplan
            ${{ inputs.environment-path }}/plan.txt

  approval:
    runs-on: ubuntu-latest
    needs: plan
    environment: ${{ inputs.environment-name }}  # Requires approval in GitHub Environment settings
    steps:
      - run: echo "Approval granted via GitHub Environment"

  apply:
    runs-on: ubuntu-latest
    needs: approval
    steps:
      - name: Download Terraform Source Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source-artifact-name }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.plan-artifact }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Terraform Init (Apply)
        run: |
          terraform init -reconfigure -upgrade -input=false \
            -backend-config="storage_account_name=${{ inputs.backend-storage-account }}" \
            -backend-config="container_name=${{ inputs.backend-container-name }}" \
            -backend-config="key=${{ inputs.backend-state-key }}"
        working-directory: ${{ inputs.environment-path }}

      - name: Fix Provider Permissions
        run: |
          find .terraform/providers -type f -exec chmod +x {} \;
        working-directory: ${{ inputs.environment-path }}

      - name: Terraform Apply
        run: terraform apply -input=false tfplan
        working-directory: ${{ inputs.environment-path }}