name: Terraform Deploy Pipeline

on:
  workflow_run:
    workflows: ["Terraform Build Pipeline"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (e.g., dev, uat, prd)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dlv
          - dev
          - uat
          - prd

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-terraform-plan-apply.yml
    with:
      terraform-version: 'latest'
      environment-path: 'environments/dev01'  # Dynamically map based on input if needed
      backend-storage-account: 'adoterraformstate'
      backend-container-name: 'terraform'
      backend-state-key: 'poc.tfstate'
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      source-artifact-name: 'terraform-source-${{ github.run_number }}'  # Adjust to match build's run_number
      environment-name: 'dev01'  # GitHub Environment for approval
    secrets: inherit  # Pass all secrets