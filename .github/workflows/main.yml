# Reusable Workflow: terraform-validate-build.yml
# Purpose: Validate aur package Terraform configurations
# Usage: Is workflow ko apne main workflow me call karo using 'uses'

name: Terraform Validate and Build

on:
  workflow_call:
    inputs:
      working_directory_base:
        description: 'Terraform base directory path'
        required: false
        type: string
        default: 'terraform-build-and-deploy'
      terraform_version:
        description: 'Terraform version to install'
        required: false
        type: string
        default: '1.9.0'
      runs_on:
        description: 'Runner to use (ubuntu-latest, etc.)'
        required: false
        type: string
        default: 'ubuntu-latest'
      artifact_name:
        description: 'Artifact name prefix'
        required: false
        type: string
        default: 'terraform-source'

jobs:
  validate-and-package:
    name: Validate and Package Terraform
    runs-on: ${{ inputs.runs_on }}
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
      
      - name: Validate Terraform Syntax
        shell: bash
        run: |
          set -uo pipefail
          
          WORKING_DIR_BASE="${{ inputs.working_directory_base }}"
          echo "Working Directory Base: $WORKING_DIR_BASE"
          
          if [[ -z "$WORKING_DIR_BASE" ]]; then
            echo "::error::Working Directory Base not set"
            exit 2
          fi
          
          # Resolve absolute path
          WORKING_DIR_BASE="$(cd "$WORKING_DIR_BASE" && pwd)"
          
          # Find all directories containing .tf files
          mapfile -t tf_dirs < <(find "$WORKING_DIR_BASE" -type f -name '*.tf' -printf '%h\n' | sort -u)
          
          if [[ ${#tf_dirs[@]} -eq 0 ]]; then
            echo "No Terraform directories found under: $WORKING_DIR_BASE"
            exit 0
          fi
          
          # Validate each Terraform directory
          for dir in "${tf_dirs[@]}"; do
            echo "Validating: $dir"
            (
              cd "$dir" || exit 1
              
              # Initialize without backend
              terraform init -backend=false
              init_status=$?
              
              if [[ $init_status -ne 0 ]]; then
                echo "::error::Terraform init failed for $dir"
                exit 1
              fi
              
              # Validate configuration
              terraform validate
              validate_status=$?
              
              if [[ $validate_status -ne 0 ]]; then
                echo "::error::Validation failed for $dir"
                exit 1
              fi
            )
            
            if [[ $? -ne 0 ]]; then
              exit 1
            fi
          done
          
          echo "✅ All Terraform validations passed"
      
      - name: Upload Terraform Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ github.run_number }}
          path: ${{ inputs.working_directory_base }}
          retention-days: 30
          if-no-files-found: error
